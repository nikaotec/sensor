server {
    listen 80;
    server_name nikaotech.com www.nikaotech.com;

    # Redirect HTTP to HTTPS (Cloudflare handles SSL)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name nikaotech.com www.nikaotech.com;

    # SSL certificates - Let's Encrypt (adicionar após certbot)
    ssl_certificate /etc/letsencrypt/live/nikaotech.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nikaotech.com/privkey.pem;

    # Dashboard (React app)
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # MQTT WebSocket Proxy - via Cloudflare HTTPS
    location /mqtt {
        proxy_pass http://127.0.0.1:9001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # API endpoints
    location /api/ {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}