services:
  # ── EMQX v5 ─────────────────────────────────────────────────────────────────
  emqx:
    image: emqx/emqx:5.8.3
    container_name: emqx
    restart: unless-stopped
    ports:
      - "1883:1883" # MQTT TCP
      - "8083:8083" # MQTT WebSocket (Dashboard React usa esta porta)
      - "8084:8084" # MQTT WebSocket/TLS
      - "8883:8883" # MQTT TLS
      - "18083:18083" # EMQX Dashboard Web UI
    volumes:
      - emqx_data:/opt/emqx/data
      - emqx_log:/opt/emqx/log
    #      - ./emqx.conf:/opt/emqx/etc/emqx.conf:ro
    environment:
      EMQX_NODE__NAME: "emqx@127.0.0.1"
      EMQX_DASHBOARD__DEFAULT_PASSWORD: "Nikaotec@2025"
      # Autenticação via arquivo de senhas (built-in)
      EMQX_AUTHENTICATION__1__MECHANISM: "password_based"
      EMQX_AUTHENTICATION__1__BACKEND: "built_in_database"
      EMQX_AUTHENTICATION__1__PASSWORD_HASH_ALGORITHM__NAME: "sha256"
    networks:
      - evolution-net

volumes:
  emqx_data:
  emqx_log:

networks:
  evolution-net:
    external: true
